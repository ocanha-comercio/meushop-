<!DOCTYPE html>
<html>
<head><title>MeuShop Teste</title></head>
<body>
<h1>MeuShop funcionando!</h1>
<p id="r">Carregando...</p>
<script>
fetch('/api/status').then(function(r){return r.json()}).then(function(d){document.getElementById('r').textContent='Marketplaces: '+d.marketplaces.join(', ')}).catch(function(e){document.getElementById('r').textContent='Erro: '+e.message});
</script>
</body>
</html>
